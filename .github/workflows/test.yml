name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Verify ecosystem invariants
        run: python scripts/verify_ecosystem_invariants.py
      - name: Run test suite with coverage
        run: python -m pytest tests/ -v --cov=models --cov=services --cov=server --cov-report=term-missing
      - name: Audit dependencies for known vulnerabilities
        run: python -m pip_audit -r requirements.txt

