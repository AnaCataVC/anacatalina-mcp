name: Upstream drift

# Kept out of the PR gate on purpose: drift is caused by commits in
# anacatalina-cv or projects-hub, not by the change under review.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  ISSUE_TITLE: "Upstream drift: data/cv_data.json is out of sync"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # Sibling layout so DataAuditor resolves ../anacatalina-cv and ../projects-hub by default.
      - uses: actions/checkout@v4
        with:
          path: anacatalina-mcp
      - uses: actions/checkout@v4
        with:
          repository: AnaCataVC/anacatalina-cv
          ref: main
          path: anacatalina-cv
      - uses: actions/checkout@v4
        with:
          repository: AnaCataVC/projects-hub
          ref: main
          path: projects-hub
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r anacatalina-mcp/requirements.txt

      - name: Audit
        id: audit
        working-directory: anacatalina-mcp
        run: |
          if python scripts/sync_mcp_data.py --check-only; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
            python scripts/sync_mcp_data.py > "$RUNNER_TEMP/report.txt"
          fi

      - name: Open or update the drift issue
        if: steps.audit.outputs.in_sync == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "The scheduled audit found drift against \`main\` of anacatalina-cv / projects-hub."
            echo
            echo '```'
            cat "$RUNNER_TEMP/report.txt"
            echo '```'
            echo
            echo "See docs/upstream-sync.md for how to resolve it."
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --state all --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ -z "$number" ]; then
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue reopen "$number" || true
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Auto-sync dataset and generate remediation PR
        if: steps.audit.outputs.in_sync == 'false'
        working-directory: anacatalina-mcp
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pip install -r requirements-dev.txt
          python scripts/sync_mcp_data.py --sync
          python scripts/verify_ecosystem_invariants.py
          python -m pytest tests/ -v

          if [ -n "$(git status --porcelain data/cv_data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            BRANCH_NAME="chore/auto-sync-upstream-data"
            git checkout -B "$BRANCH_NAME"
            git add data/cv_data.json
            git commit -m "chore(data): auto-sync cv_data.json with upstream repositories"
            git push -u origin "$BRANCH_NAME" --force

            PR_TITLE="chore(data): auto-sync cv_data.json with upstream repositories"
            existing_pr=$(gh pr list --state open --head "$BRANCH_NAME" --json number --jq ".[0].number // empty")
            if [ -z "$existing_pr" ]; then
              gh pr create --title "$PR_TITLE" \
                --body "Automated synchronization with upstream \`anacatalina-cv\` and \`projects-hub\` following drift detection. All automated tests and invariant gates passed successfully." \
                --base main --head "$BRANCH_NAME" || true
            fi
          fi

      - name: Close the drift issue once back in sync
        if: steps.audit.outputs.in_sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Back in sync with anacatalina-cv and projects-hub."
          fi
