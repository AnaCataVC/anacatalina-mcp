name: Upstream drift

# Kept out of the PR gate on purpose: drift is caused by commits in
# anacatalina-cv or projects-hub, not by the change under review.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-drift
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  ISSUE_TITLE: "Upstream drift: data/cv_data.json is out of sync"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # Sibling layout so DataAuditor resolves ../anacatalina-cv and ../projects-hub by default.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: anacatalina-mcp
      - uses: actions/checkout@v4
        with:
          repository: AnaCataVC/anacatalina-cv
          ref: main
          path: anacatalina-cv
      - uses: actions/checkout@v4
        with:
          repository: AnaCataVC/projects-hub
          ref: main
          path: projects-hub
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            anacatalina-mcp/requirements.txt
            anacatalina-mcp/requirements-dev.txt
      - run: pip install -r anacatalina-mcp/requirements-dev.txt

      - name: Audit upstream drift
        id: audit
        working-directory: anacatalina-mcp
        run: |
          if python scripts/sync_mcp_data.py --check-only; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
            python scripts/sync_mcp_data.py > "$RUNNER_TEMP/report.txt" || true
          fi

      - name: Auto-sync, validate, and push directly to main
        id: autosync
        if: steps.audit.outputs.in_sync == 'false'
        working-directory: anacatalina-mcp
        run: |
          set +e
          fail() {
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "failure_reason=$1" >> "$GITHUB_OUTPUT"
            python scripts/sync_mcp_data.py > "$RUNNER_TEMP/report.txt" || true
            exit 0
          }

          python scripts/sync_mcp_data.py --sync || fail "scripts/sync_mcp_data.py --sync failed"
          python scripts/verify_ecosystem_invariants.py || fail "scripts/verify_ecosystem_invariants.py failed after sync"
          python -m pytest tests/ -q || fail "pytest test suite failed after sync"
          python scripts/sync_mcp_data.py --check-only || fail "drift remains after --sync (manual intervention required, e.g. missing i18n keys)"

          if [ -n "$(git status --porcelain data/cv_data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/cv_data.json
            git commit -m "chore(data): auto-sync cv_data.json with upstream repositories" || fail "git commit failed"

            if ! git push origin HEAD:main; then
              git pull --rebase origin main && git push origin HEAD:main || fail "git push to main failed"
            fi

            COMMIT_SHA=$(git rev-parse --short HEAD)
            echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          fi

          echo "synced=true" >> "$GITHUB_OUTPUT"

      - name: Close drift issue once in sync
        if: steps.audit.outputs.in_sync == 'true' || steps.autosync.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            if [ "${{ steps.autosync.outputs.synced }}" = "true" ] && [ -n "${{ steps.autosync.outputs.commit_sha }}" ]; then
              gh issue close "$number" --comment "Auto-synced \`data/cv_data.json\` directly to \`main\` in commit \`${{ steps.autosync.outputs.commit_sha }}\` (invariants, pytest, and post-sync audit passed)."
            else
              gh issue close "$number" --comment "Back in sync with anacatalina-cv and projects-hub."
            fi
          fi

      - name: Open or update drift issue when auto-sync fails
        if: steps.audit.outputs.in_sync == 'false' && steps.autosync.outputs.synced != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "The scheduled audit found drift against \`main\` of \`anacatalina-cv\` / \`projects-hub\`, and automated remediation could not complete."
            echo
            echo "**Failure reason:** ${{ steps.autosync.outputs.failure_reason }}"
            echo "**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            cat "$RUNNER_TEMP/report.txt"
            echo '```'
            echo
            echo "See \`docs/upstream-sync.md\` for how to resolve it."
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --state all --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ -z "$number" ]; then
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue reopen "$number" || true
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          fi
          exit 1
